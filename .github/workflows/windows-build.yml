name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      registry_profile:
        description: Profile full registry capture (counts and timings only)
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform == 'Win32' && 'x86' || 'x64' }}
      - name: Build
        run: msbuild HackerslangsRegShot/HackerslangsRegShot.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143
      - name: Test checksums
        shell: cmd
        env:
          REGSHOT_BENCHMARK_REGISTRY: ${{ inputs.registry_profile && matrix.platform == 'x64' && '1' || '0' }}
        run: tests\run-checksum-test.cmd
      - name: Upload Windows x64 executable
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: xxHash-Regshot-windows-x64
          path: HackerslangsRegShot/x64/Release/HackerslangsRegShot.exe
          if-no-files-found: error
