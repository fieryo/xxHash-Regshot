name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform == 'Win32' && 'x86' || 'x64' }}
      - name: Build
        run: msbuild HackerslangsRegShot/HackerslangsRegShot.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143
      - name: Test checksums
        shell: cmd
        run: tests\run-checksum-test.cmd
